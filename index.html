<!doctype html>
<html lang="zh-CN">
<!-- 这个文件用记事本或 VS Code 打开改；不要用 WPS / Word 打开后保存，会把网页格式破坏掉。 -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>班级天气预报 · 心理状态问卷</title>
<meta name="description" content="匿名填写，3 分钟。只用来了解我们班这段时间的整体状态。">
<meta name="theme-color" content="#cfe2f1">
<style>
:root{
  --bg-1:#cfe2f1;
  --bg-2:#f8e8d2;
  --bg-3:#f0d5b4;
  --ink:#33261d;
  --ink-soft:rgba(51,38,29,.72);
  --ink-faint:rgba(51,38,29,.46);
  --line:rgba(51,38,29,.13);
  --card:rgba(255,255,255,.66);
  --accent:#c2601f;
  --accent-2:#e0924a;
  --cream:#fdf8f0;
  --serif:"Songti SC","STSong","Source Han Serif SC","Noto Serif CJK SC","SimSun",serif;
  --sans:"PingFang SC","HarmonyOS Sans SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --r:18px;
}
*{box-sizing:border-box}
html{overflow-x:hidden}
html,body{margin:0;padding:0}
body{
  background:var(--bg-1);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.75;
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
  overflow-x:hidden;
}
body::after{
  content:"";position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.035;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
}

/* ---------- 晨光 · 日出 ----------
   天光偏冷压在上面，暖色沉到地平线，右上角一枚太阳，底下三层远山。
   远山压在视口底部、山脚有雾，正文所在的那条竖带保持干净。 */
.sky{position:fixed;inset:0;z-index:0;overflow:hidden;
  background:
    radial-gradient(30% 18% at 74% 66%, rgba(255,226,164,.92) 0%, rgba(255,226,164,0) 72%),
    radial-gradient(88% 40% at 52% 108%, rgba(244,154,78,.42) 0%, rgba(244,154,78,0) 66%),
    linear-gradient(180deg,#cfe2f1 0%,#e2eaea 16%,#f6ecd8 34%,#fbe2bd 55%,#f7cba0 76%,#f0b47a 100%);
}
.sun{position:absolute;right:7%;top:4%;width:88px;height:88px;border-radius:50%;
  background:radial-gradient(closest-side,#fffaf0 0%,#ffe9c0 46%,#ffd79b 66%,rgba(255,215,155,0) 80%);
  filter:blur(2.5px);animation:sun 26s ease-in-out infinite alternate;
}
@keyframes sun{from{transform:scale(1);opacity:.94}to{transform:scale(1.05);opacity:1}}
.land{position:absolute;left:0;right:0;bottom:0;width:100%;height:30vh;display:block;filter:blur(.5px)}
.mist{position:absolute;left:0;right:0;bottom:0;height:28vh;
  background:linear-gradient(180deg, rgba(253,248,240,0) 0%, rgba(253,248,240,.40) 58%, rgba(253,248,240,.55) 100%);
}
.cloud{position:absolute;border-radius:50%;
  background:linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.90), rgba(255,255,255,0));
  filter:blur(24px);
}
.cloud.c1{width:70%;top:16%;left:2%;height:44px;opacity:.66;animation:drift 170s linear infinite}
.cloud.c2{width:52%;top:28%;left:-14%;height:32px;opacity:.45;animation:drift 230s linear infinite}
@keyframes drift{from{transform:translateX(-8%)}to{transform:translateX(18%)}}

/* ---------- 内容 ---------- */
main{position:relative;z-index:1;max-width:560px;margin:0 auto;
  padding:clamp(30px,8vw,60px) 22px calc(48px + env(safe-area-inset-bottom));}

.reveal{animation:rise .8s cubic-bezier(.22,.72,.24,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

.kicker{margin:0 0 14px;font-size:12.5px;letter-spacing:.22em;color:var(--ink-soft);}
.kicker b{color:var(--accent);font-weight:600}
h1{margin:0;font-family:var(--serif);font-weight:400;
  font-size:clamp(36px,12vw,54px);line-height:1.08;letter-spacing:.05em;}
h1 .thin{display:block;margin-top:12px;font-size:.30em;letter-spacing:.26em;
  color:var(--ink-faint);overflow-wrap:anywhere}
.lede{margin:20px 0 0;color:var(--ink-soft);font-size:15px;max-width:32em}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:20px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 20px 44px -34px rgba(120,70,30,.55)}
.card h2{margin:0 0 4px;font-family:var(--serif);font-weight:400;font-size:19px;letter-spacing:.08em}
.card .sub{margin:0 0 16px;font-size:12.5px;color:var(--ink-faint);letter-spacing:.1em}

.bars{display:grid;gap:11px}
.bar-row{display:grid;grid-template-columns:3.6em 1fr 2.6em;align-items:center;gap:12px;font-size:14px}
.bar-row .label{color:var(--ink-soft)}
.bar-track{display:block;height:7px;border-radius:99px;background:rgba(51,38,29,.09);overflow:hidden}
.bar-fill{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,#e8bf85,var(--accent));
  transform-origin:left;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.bar-row .num{text-align:right;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.note{margin:18px 0 0;padding-top:16px;border-top:1px dashed var(--line);font-size:14px;color:var(--ink-soft)}

.btn{display:block;width:100%;margin:0;padding:17px 20px;border:0;border-radius:999px;
  font-family:inherit;font-size:16.5px;font-weight:600;letter-spacing:.1em;cursor:pointer;
  background:linear-gradient(180deg,#d88741,#bc5b1d);color:#fff7ee;
  box-shadow:0 16px 32px -18px rgba(160,74,20,.85);
  transition:transform .18s ease,box-shadow .18s ease}
.btn:active{transform:translateY(1px) scale(.988);box-shadow:0 10px 20px -16px rgba(160,74,20,.9)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid rgba(51,38,29,.22);
  box-shadow:none;font-weight:500;letter-spacing:.12em;font-size:15px}
.btn.ghost:active{background:rgba(51,38,29,.05)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.hint{margin:12px 2px 0;font-size:12.5px;color:var(--ink-faint);text-align:center;letter-spacing:.06em}

.panel{margin-top:22px;border-radius:var(--r);border:1px solid var(--line);
  background:rgba(255,255,255,.56);overflow:hidden}
.panel[hidden]{display:none}
.qr{padding:26px 20px 22px;text-align:center}
.qr-kicker{margin:0 0 16px;font-size:12.5px;letter-spacing:.26em;color:var(--ink-faint)}
.qr-slot{display:inline-block;padding:14px;border-radius:18px;background:#fff;
  box-shadow:0 20px 40px -24px rgba(120,70,30,.5)}
.qr-slot img{display:block;width:min(58vw,208px);height:auto;border-radius:6px}
.qr-slot.empty{display:grid;place-items:center;width:min(58vw,208px);height:min(58vw,208px);
  margin:0 auto;padding:14px;background:transparent;border:1px dashed rgba(51,38,29,.28);box-shadow:none;
  color:var(--ink-faint);font-size:12.5px;line-height:1.75;text-align:center}
.qr-hint{margin:16px 0 0;font-size:13px;color:var(--ink-soft)}
.qr-alt{display:block;padding:16px;border-top:1px solid var(--line);text-align:center;
  font-size:13.5px;color:var(--accent);font-weight:500;text-decoration:none}

.warn{margin:18px 0 0;padding:14px 16px;border-radius:14px;font-size:13.5px;line-height:1.7;
  background:rgba(226,148,64,.13);border:1px solid rgba(194,96,31,.30);color:#8a4a17}
.warn[hidden]{display:none}
.warn code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;color:#a24f14}

.draw{margin-top:30px;text-align:center}
.draw p{margin:0 0 14px;font-size:13.5px;color:var(--ink-faint)}

footer{margin-top:44px;padding-top:22px;border-top:1px solid var(--line);
  font-size:13px;color:var(--ink-faint);line-height:1.9}
footer strong{display:block;margin-bottom:8px;font-weight:600;color:var(--ink-soft);letter-spacing:.1em}
footer a{color:var(--ink-soft);text-decoration:none;border-bottom:1px dotted var(--line)}

/* ---------- 心情卡 ---------- */
.dialog{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
  padding:22px;background:rgba(60,34,12,.52);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  animation:fade .28s ease both}
.dialog[hidden]{display:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:340px}
.ticket{background:linear-gradient(160deg,#e08b3f,#ba571a);color:#fff7ee;border-radius:16px;
  padding:34px 26px 30px;box-shadow:0 30px 70px -30px rgba(90,45,10,.7);
  position:relative;overflow:hidden;
  animation:deal .5s cubic-bezier(.2,.9,.25,1) both}
@keyframes deal{from{opacity:0;transform:translateY(14px) rotate(-4deg) scale(.92)}
  to{opacity:1;transform:rotate(-1.2deg) scale(1)}}
.ticket::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;
  background:linear-gradient(90deg,#ffe1b5,rgba(255,255,255,.9))}
.ticket-no{display:block;font-size:11.5px;letter-spacing:.28em;color:rgba(255,247,238,.7)}
.ticket-text{margin:22px 0 0;font-family:var(--serif);font-size:21px;line-height:1.75;letter-spacing:.03em}
.sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.sheet-actions .btn.ghost{color:#fff3e4;border-color:rgba(255,247,238,.42)}
.sheet-actions .btn.ghost:active{background:rgba(255,247,238,.14)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<div class="sky">
  <div class="sun"></div>
  <svg class="land" viewBox="0 0 1000 420" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 150 C120 132 200 158 300 142 C420 122 480 150 600 134 C700 120 780 88 880 100 C940 108 980 130 1000 122 L1000 420 L0 420 Z" fill="#e6c7a2" fill-opacity=".48"/>
    <path d="M0 228 C140 208 240 236 380 220 C520 204 620 232 760 218 C860 208 940 230 1000 216 L1000 420 L0 420 Z" fill="#d3ab7f" fill-opacity=".55"/>
    <path d="M0 322 C160 302 300 330 460 316 C620 302 760 326 1000 306 L1000 420 L0 420 Z" fill="#c99e70" fill-opacity=".55"/>
  </svg>
  <div class="mist"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
</div>

<main>
  <header class="reveal">
    <p class="kicker">第 <b id="period">1</b> 期 · <span id="range"></span></p>
    <h1>班级<span style="letter-spacing:.16em">天气</span>预报<span class="thin">WEATHER REPORT</span></h1>
    <p class="lede" id="lede"></p>
  </header>

  <section class="card reveal" id="reviewCard" style="animation-delay:.12s;margin-top:30px">
    <h2 id="reviewTitle">上期回顾</h2>
    <p class="sub">大家写下的心情，我照着报了一遍</p>
    <div class="bars" id="bars"></div>
    <p class="note" id="reviewNote"></p>
  </section>

  <div class="warn" id="warn" hidden>
    还没放二维码。把问卷二维码图片存成 <code>qr.png</code>，放进这个文件夹就能用了。
  </div>

  <div class="reveal" style="animation-delay:.24s;margin-top:26px">
    <button class="btn" id="start">开始填写 · 3 分钟</button>
    <p class="hint" id="startHint">匿名 · 12 题 · 数据只用于了解班级整体状态</p>
  </div>

  <section class="panel reveal" id="panel" hidden style="animation-delay:.3s"></section>

  <section class="draw reveal" style="animation-delay:.36s">
    <p>填完了、或者还没想好，都可以先抽一张</p>
    <button class="btn ghost" id="draw">抽一张心情卡</button>
  </section>

  <footer class="reveal" style="animation-delay:.44s">
    <strong>关于匿名</strong>
    这份问卷不记名，结果只用来看班级整体的状态，不做任何评价，也不会拿去做别的用途。要是我看到你需要帮忙，我会私下找你，不会在班里说。
    <strong style="margin-top:18px">想直接找人聊</strong>
    <div id="contacts"></div>
  </footer>
</main>

<div class="dialog" id="dialog" hidden role="dialog" aria-modal="true" aria-label="心情卡">
  <div class="sheet">
    <div class="ticket">
      <span class="ticket-no" id="ticketNo"></span>
      <p class="ticket-text" id="ticketText"></p>
    </div>
    <div class="sheet-actions">
      <button class="btn ghost" id="again">再来一张</button>
      <button class="btn ghost" id="closeCard">收好</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   每期只需要改这里几行。
   period / range  : 期数和收集时间
   lede            : 开场那句话
   weather         : 上期大家心情词的统计，第一期没有就写 {}（这一整块会自动隐藏）
   reviewNote      : 上期做过的一件事，让同学看到"填了有用"
   qr              : 问卷二维码图片的文件名，放在这个文件夹里
   questionnaireUrl: 选填。填了的话，页面上会多一个"直接打开问卷"的出口
   ============================================================ */
const CONFIG = {
  period: 1,
  range: "10月13日 — 10月26日",
  lede: "这是我们班的第一次心情播报。问卷 3 分钟就够了，匿名填写，只用来了解我们班这段时间的整体状态。",
  weather: {},
  reviewTitle: "上期回顾",
  reviewNote: "",
  qr: "qr.png",
  questionnaireUrl: "",
  contacts: [
    "QQ 咨询：177620749（周日—周五 18:30—21:30）",
    "朋辈咨询：卫管楼 402 咨询室（周一—周五 18:30—21:30 可预约）",
    "电话咨询：13825678642（周一—周五 18:30—21:30，可预约老师和朋辈咨询）"
  ]
};

const CARDS = [
  "今晚早点关灯。",
  "你已经熬过很多个这样的星期了。",
  "想哭就哭，第二天眼睛肿了也没人管。",
  "记得吃饭，随便什么都行。",
  "睡不着的人不止你一个，但还是希望你今晚能睡着。",
  "有话说不出口，可以先写在纸上。",
  "天气不好的时候，什么都往后放一放也可以。",
  "今天做完了一件事，就够了。",
  "去找那个人说句话吧，他可能也在等你先开口。",
  "允许自己有一个什么都不干的晚上。",
  "你不是懒，你只是累了。",
  "别把话说得太满，对自己也是。",
  "期末还很远，先过好这一周。",
  "冷的话多穿点，别硬扛。",
  "难过是有理由的，不用急着先解释理由。",
  "一个人吃饭也没关系，偶尔可以叫上谁。",
  "有想看的剧就先看一集，作业明天再说。",
  "不是所有问题都要今天解决的。",
  "心情有起伏很正常，不代表你出问题了。",
  "记得喝水。",
  "你比自己以为的要耐扛一点。",
  "想找人说话的时候，我在。",
  "走得慢也是在走。",
  "别在夜里做重要的决定。"
];

const $ = (id) => document.getElementById(id);
const noQr = !CONFIG.qr;

$("period").textContent = CONFIG.period;
$("range").textContent = CONFIG.range;
$("lede").textContent = CONFIG.lede;
$("reviewTitle").textContent = CONFIG.reviewTitle;

/* 上期回顾 */
const entries = Object.entries(CONFIG.weather || {});
if (entries.length) {
  const max = Math.max(...entries.map(([, n]) => n));
  $("bars").innerHTML = entries.map(([label, n], i) => `
    <div class="bar-row">
      <span class="label">${label}</span>
      <span class="bar-track"><span class="bar-fill" style="width:${Math.round(n / max * 100)}%;animation-delay:${.25 + i * .09}s"></span></span>
      <span class="num">${n} 人</span>
    </div>`).join("");
  $("reviewNote").textContent = CONFIG.reviewNote || "";
} else {
  $("reviewCard").hidden = true;
}

/* 联系方式 */
$("contacts").innerHTML = CONFIG.contacts.map((c) => `<div>· ${c}</div>`).join("");

/* 问卷入口 */
const panel = $("panel");
if (noQr) $("warn").hidden = false;

$("start").addEventListener("click", () => {
  if (!panel.dataset.built) {
    const alt = CONFIG.questionnaireUrl
      ? `<a class="qr-alt" href="${CONFIG.questionnaireUrl}" target="_blank" rel="noopener">在手机上直接打开问卷 →</a>`
      : "";
    panel.innerHTML = `
      <div class="qr">
        <p class="qr-kicker">扫码填写</p>
        <div id="qrSlot"></div>
        <p class="qr-hint">用微信扫一扫；手机上可以直接长按二维码识别</p>
      </div>${alt}`;
    const slot = $("qrSlot");
    const empty = () => {
      slot.className = "qr-slot empty";
      slot.textContent = `把问卷二维码图片命名为 ${CONFIG.qr || "qr.png"}，放进这个网页文件夹`;
    };
    if (noQr) {
      empty();
    } else {
      const img = new Image();
      img.alt = "问卷二维码";
      img.onload = () => { slot.className = "qr-slot"; slot.appendChild(img); };
      img.onerror = empty;
      img.src = CONFIG.qr;
    }
    panel.dataset.built = "1";
  }
  panel.hidden = false;
  panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
});

/* 心情卡 */
let last = -1;
$("draw").addEventListener("click", () => {
  let i;
  do { i = Math.floor(Math.random() * CARDS.length); } while (CARDS.length > 1 && i === last);
  last = i;
  $("ticketNo").textContent = "心情卡 No." + String(i + 1).padStart(2, "0");
  $("ticketText").textContent = CARDS[i];
  const dlg = $("dialog");
  dlg.hidden = false;
  const sheet = dlg.querySelector(".ticket");
  sheet.style.animation = "none";
  void sheet.offsetWidth;
  sheet.style.animation = "";
});
$("again").addEventListener("click", () => $("draw").click());
$("closeCard").addEventListener("click", () => { $("dialog").hidden = true; });
$("dialog").addEventListener("click", (e) => { if (e.target.id === "dialog") $("dialog").hidden = true; });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("dialog").hidden = true; });
</script>
</body>
</html>
